# Policy Gate
#
# Scores a pull request's diff through the org's model router against one
# fixed rubric, chosen by the `rubric` input, and posts one sticky PR comment
# with the verdict. `policy` (the default) is the five-check policy gate (DRY,
# native-first, disclosure, missing-test, token-budget). `security`, `leak` and
# `semantic` are advisory reviews of the same diff. Those three also post a
# check run on the verdict; each rubric has its own check name, comment marker
# and override label, so one caller can run several on one pull request.
#
# Advisory by default: it never fails the job unless the caller passes
# `blocking: true`. The rubric's override label (`policy-gate-override` for
# `policy`) skips the router call entirely, posts a neutral comment, and
# publishes one audit line to the ntfy hub instead - an escape hatch that is
# visible, not silent.
#
# Same router contract as docs-drift.yml. Every rubric uses one stable check
# run on the head commit. A failed router request is not a review finding: the
# check run stays neutral and its summary names the error class. A rerun after
# recovery updates that same run. Blocking callers still fail closed on gateway
# errors; neutral never means pass.
# Blocking leak findings stay advisory before LEAK_ADVISORY_END_DATE and fail on
# and after it. Security and semantic findings remain blocking throughout.
# It needs a runner that can reach the router. Never make it a required
# check while `blocking` is false - an advisory check has nothing to
# require.
#
# Two jobs. `review` calls the router on the untrusted pull request text and diff and
# stages the verdict as an artifact. It holds no GitHub App key or App id. `gate` checks
# the staged verdict against its schema, renders it, and posts the comment and check run.
# Only `gate` holds the App key; the router key stays in `review`.
#
# This is a reusable workflow that can be called from other repositories.
#
# Permissions: deliberately no top-level `permissions:` block. A called
# workflow's block is a ceiling on the caller's grant, never an elevation,
# and GitHub validates it at startup for every job in the graph - even one
# whose `if:` is false - so requesting `pull-requests: write` here fails the
# whole calling workflow for any consumer that grants read only, while
# declaring `contents: read` alone would strip write from callers that do
# grant it. Inheriting the caller's grant is the only shape that serves
# both, so both jobs inherit it. The sticky comment step needs
# `pull-requests: write` on the CALLING workflow; without it that step fails
# and posts nothing, which is the documented advisory behaviour.

name: Policy Gate

# Blocking leak findings become enforceable on this UTC date.
env:
  LEAK_ADVISORY_END_DATE: "2026-11-23"

on:
  workflow_call:
    inputs:
      rubric:
        description: >-
          Which review to run: policy (the default five-check policy gate),
          security, leak, or semantic. Each has its own check name, comment
          marker and override label.
        type: string
        required: false
        default: policy
      runner_label:
        description: >-
          Runner label for the job. Must be a runner that can reach the model
          router.
        type: string
        required: false
        default: self-hosted
      model:
        description: >-
          Router ROLE alias to call. Always an alias the router resolves -
          never a vendor model id.
        type: string
        required: false
        default: medium
      max_diff_kb:
        description: "Truncate the pull request diff at this many KiB"
        type: number
        required: false
        default: 150
      max_tokens:
        description: "Completion token ceiling for the rubric call"
        type: number
        required: false
        default: 1500
      blocking:
        description: >-
          When false (the default, advisory rollout), a failing check posts
          the comment and still exits 0. When true, a failing check fails
          the job - except leak findings before LEAK_ADVISORY_END_DATE and
          unless the rubric's override label is on the pull request.
        type: boolean
        required: false
        default: false
    secrets:
      LLM_ROUTER_BASE_URL:
        description: >-
          The router's OpenAI-compatible base URL, ending in /v1. A secret
          rather than a variable: run logs print step environments verbatim.
          The job's first step fails closed if it's missing.
        required: false
      LLM_ROUTER_API_KEY:
        description: >-
          Scoped router virtual key (never the router master key). The job's
          first step fails closed if it's missing.
        required: false
      NTFY_BASE_URL:
        description: >-
          Base URL of the ntfy hub the override escape hatch publishes one
          audit line to (topic "ai"). Optional: the publish step is skipped,
          not failed, when this is absent.
        required: false
      GH_APP_CLAUDE_BOT_PRIVATE_KEY:
        description: >-
          Private key of the Claude bot App. Mints the token that posts the
          neutral or failure check run on a gateway failure. Without it the
          gateway path fails the job.
        required: false

concurrency:
  group: ${{ inputs.rubric == 'policy' && 'policy-gate' || format('{0}-review', inputs.rubric) }}-${{ github.repository }}
  cancel-in-progress: false

jobs:
  review:
    name: Review the diff
    runs-on: ${{ inputs.runner_label || 'self-hosted' }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 30 }}
    # Names derived from the rubric. The policy values are the names this
    # workflow has always used, so the policy path is unchanged.
    env:
      REVIEW_NAME: ${{ inputs.rubric == 'policy' && 'policy-gate' || format('{0}-review', inputs.rubric) }}
      OVERRIDE_LABEL: ${{ inputs.rubric == 'policy' && 'policy-gate-override' || format('{0}-review-override', inputs.rubric) }}
    outputs:
      has_override: ${{ steps.override.outputs.has_override }}
      verdict_status: ${{ steps.handoff.outputs.status }}
    steps:
      - name: Check the rubric name
        env:
          RUBRIC: ${{ inputs.rubric }}
        run: |
          printf '%s\n' policy security leak semantic | grep -qx -- "$RUBRIC" || { echo "::error::Unknown rubric: $RUBRIC"; exit 1; }

      - name: Require the router secrets
        env:
          LLM_ROUTER_BASE_URL: ${{ secrets.LLM_ROUTER_BASE_URL }}
          LLM_ROUTER_API_KEY: ${{ secrets.LLM_ROUTER_API_KEY }}
        run: |
          : "${LLM_ROUTER_BASE_URL:?LLM_ROUTER_BASE_URL not set}"
          : "${LLM_ROUTER_API_KEY:?LLM_ROUTER_API_KEY not set}"

      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout ai-workflows scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: JacobPEvans/.github-ai
          ref: ${{ job.workflow_sha }}
          sparse-checkout: |
            .github/scripts
            .github/actions/checkout-prompts
          path: .ai-workflows
          persist-credentials: false

      - name: Checkout prompt catalog
        uses: ./.ai-workflows/.github/actions/checkout-prompts
        with:
          sparse-checkout: automation/ai-workflows-${{ env.REVIEW_NAME }}.prompt.yml

      - name: Check for the override label
        id: override
        env:
          HAS_OVERRIDE: >-
            ${{ contains(github.event.pull_request.labels.*.name, env.OVERRIDE_LABEL) }}
        run: echo "has_override=$HAS_OVERRIDE" >> "$GITHUB_OUTPUT"

      - name: Collect the diff and file sizes
        if: steps.override.outputs.has_override != 'true'
        env:
          RUBRIC: ${{ inputs.rubric }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MAX_DIFF_KB: ${{ inputs.max_diff_kb }}
        run: bash .ai-workflows/.github/scripts/policy-gate/collect.sh

      # The semantic rubric judges the title and body against the diff, so they
      # go in front of the diff; its prompt reads them from {{diff}}.
      - name: Put the pull request title and body in front of the diff
        if: steps.override.outputs.has_override != 'true' && inputs.rubric == 'semantic'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf 'PULL REQUEST TITLE: %s\n\nPULL REQUEST BODY (first 8 KiB):\n%s\n\n----- end of pull request text; the diff follows -----\n' "$PR_TITLE" "${PR_BODY:0:8192}" | cat - diff.txt > diff.with-text.txt
          mv diff.with-text.txt diff.txt

      - name: Request the rubric verdict
        id: verdict
        if: steps.override.outputs.has_override != 'true'
        # A failed request is handled by the gate job, not by failing this job.
        continue-on-error: true
        uses: actions/ai-inference@a7805884c80886efc241e94a5351df715968a0ad # v2.1.1
        with:
          endpoint: ${{ secrets.LLM_ROUTER_BASE_URL }}
          token: ${{ secrets.LLM_ROUTER_API_KEY }}
          model: ${{ inputs.model }}
          max-completion-tokens: ${{ inputs.max_tokens }}
          temperature: "0"
          prompt-file: .ai-llm-prompts/automation/ai-workflows-${{ env.REVIEW_NAME }}.prompt.yml
          file_input: |
            changed: changed.txt
            sizes: sizes.txt
            diff: diff.txt
          custom-headers: "x-langfuse-trace-name: ${{ env.REVIEW_NAME }}"

      # Stages the verdict for the gate job. The verdict is only a model reply here; the
      # gate job validates it before it is rendered or posted.
      - name: Stage the verdict for the gate job
        id: handoff
        env:
          HAS_OVERRIDE: ${{ steps.override.outputs.has_override }}
          VERDICT_OUTCOME: ${{ steps.verdict.outcome }}
          RESPONSE_FILE: ${{ steps.verdict.outputs.response-file }}
        run: |
          mkdir -p handoff
          if [ "$HAS_OVERRIDE" = "true" ]; then
            echo "status=override" >> "$GITHUB_OUTPUT"
          elif [ "$VERDICT_OUTCOME" = "success" ]; then
            cp "$RESPONSE_FILE" handoff/verdict.json
            echo "status=ok" >> "$GITHUB_OUTPUT"
          else
            echo "status=router-request-failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the verdict handoff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.REVIEW_NAME }}-handoff-${{ github.run_id }}
          path: handoff/verdict.json
          if-no-files-found: ignore
          retention-days: 1

  gate:
    name: Policy gate
    needs: [review]
    # Runs after a failed review too, so the check reports the failure rather than
    # being skipped. The first step below fails the job when the review did not succeed.
    if: always()
    runs-on: ${{ inputs.runner_label || 'self-hosted' }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 30 }}
    env:
      REVIEW_NAME: ${{ inputs.rubric == 'policy' && 'policy-gate' || format('{0}-review', inputs.rubric) }}
      REVIEW_TITLE: ${{ inputs.rubric == 'security' && 'Security review' || inputs.rubric == 'leak' && 'Leak review' || inputs.rubric == 'semantic' && 'Semantic review' || 'Policy gate' }}
      OVERRIDE_LABEL: ${{ inputs.rubric == 'policy' && 'policy-gate-override' || format('{0}-review-override', inputs.rubric) }}
    steps:
      - name: Require the review job to succeed
        if: needs.review.result != 'success'
        run: |
          echo "::error::The review job did not succeed, so there is no verdict to publish."
          exit 1

      # Only this job checks out the trusted scripts it runs with the App token. It never
      # checks out the pull request.
      - name: Checkout ai-workflows scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: JacobPEvans/.github-ai
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/scripts
          path: .ai-workflows
          persist-credentials: false

      - name: Download the verdict handoff
        if: needs.review.outputs.verdict_status == 'ok'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.REVIEW_NAME }}-handoff-${{ github.run_id }}
          path: handoff

      # A reply that does not match the rubric's verdict schema is reported like a failed
      # request: neutral when advisory, failed when blocking. Never rendered or passed.
      - name: Validate the verdict
        id: valid
        if: needs.review.outputs.verdict_status == 'ok'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUBRIC: ${{ inputs.rubric }}
          RESPONSE_FILE: handoff/verdict.json
        run: bash .ai-workflows/.github/scripts/policy-gate/validate-verdict.sh

      - name: Settle the verdict state
        id: state
        env:
          HAS_OVERRIDE: ${{ needs.review.outputs.has_override }}
          REVIEW_STATUS: ${{ needs.review.outputs.verdict_status }}
          VALID_OUTCOME: ${{ steps.valid.outcome }}
        run: |
          if [ "$HAS_OVERRIDE" = "true" ]; then
            state=override
            touch override.flag
          elif [ "$REVIEW_STATUS" != "ok" ]; then
            state=router-request-failed
          elif [ "$VALID_OUTCOME" != "success" ]; then
            state=invalid-response
          else
            state=ok
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Set verdict enforcement mode
        id: enforcement
        if: steps.state.outputs.state == 'ok'
        env:
          RUBRIC: ${{ inputs.rubric }}
          BLOCKING: ${{ inputs.blocking }}
        run: |
          blocking="$BLOCKING"
          if [[ "$RUBRIC" == leak && "$BLOCKING" == true ]]; then
            if [[ ! "$LEAK_ADVISORY_END_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::LEAK_ADVISORY_END_DATE must be a UTC date in YYYY-MM-DD format."
              exit 1
            fi
            today="$(date -u +%F)"
            if [[ "$today" < "$LEAK_ADVISORY_END_DATE" ]]; then
              blocking=false
            fi
          fi
          echo "blocking=$blocking" >> "$GITHUB_OUTPUT"

      # The check run is posted with the Claude bot App token. Mint it whenever
      # a rubric can publish or update its run. A failed mint is named by the report step.
      - name: Mint the check-run token
        id: check-token
        if: steps.state.outputs.state != 'override'
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.GH_APP_CLAUDE_BOT_ID }}
          private-key: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}
          permission-checks: write

      # actions/ai-inference does not expose the HTTP status or error text, so a
      # failed request is reported as router-request-failed.
      - name: Report gateway unavailability
        id: gateway
        if: steps.state.outputs.state == 'router-request-failed' || steps.state.outputs.state == 'invalid-response'
        env:
          NTFY_BASE_URL: ${{ secrets.NTFY_BASE_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Advisory: neutral. Blocking: failure, so the report exits 1 and the gate fails closed.
          CONCLUSION: ${{ inputs.blocking && 'failure' || 'neutral' }}
          GITHUB_TOKEN: ${{ steps.check-token.outputs.token }}
          CHECK_TOKEN_CAUSE: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY == '' && 'GH_APP_CLAUDE_BOT_PRIVATE_KEY is not set' || 'the mint step failed' }}
          CHECK_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECK_NAME: ${{ env.REVIEW_NAME }}
          CHECK_APP_SLUG: ${{ steps.check-token.outputs.app-slug }}
          REASON: ${{ steps.state.outputs.state }}
        run: |
          printf '## %s\n\nAI review not performed: gateway unavailable (%s).\n' "$REVIEW_TITLE" "$REASON" > policy-gate.md
          echo 0 > policy-gate.exit
          bash .ai-workflows/.github/scripts/shared/gateway-failure.sh report "$REVIEW_NAME" "$REASON"

      - name: Render the verdict
        id: render
        if: steps.state.outputs.state == 'ok' || steps.state.outputs.state == 'override'
        env:
          RESPONSE_FILE: handoff/verdict.json
          MODEL: ${{ inputs.model }}
          RUBRIC: ${{ inputs.rubric }}
        run: bash .ai-workflows/.github/scripts/policy-gate/render.sh

      - name: Post sticky comment
        # Runs after a failed gateway report too, so a blocking failure still shows its notice.
        if: ${{ !cancelled() && (success() || steps.gateway.outcome == 'failure') }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          BODY_FILE: policy-gate.md
          MARKER_MATCH: "<!-- ${{ env.REVIEW_NAME }} -->"
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            const run = require('./.ai-workflows/.github/scripts/shared/sticky-comment.js');
            await run({ github, context, core });

      - name: Publish the override audit line
        if: steps.state.outputs.state == 'override'
        env:
          BASE_URL: ${{ secrets.NTFY_BASE_URL }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "NTFY_BASE_URL not configured; skipping the audit publish."
            exit 0
          fi
          echo "::add-mask::$BASE_URL"
          host="${BASE_URL#*://}"; host="${host%%/*}"
          [ -n "$host" ] && echo "::add-mask::$host" && echo "::add-mask::${host%%:*}"
          curl -sS --max-time 30 -X POST "${BASE_URL%/}/ai" \
            -H "Title: $OVERRIDE_LABEL used" \
            --data "$ACTOR overrode the policy gate on $PR_URL" || true

      # Policy stays comment-only and only updates an existing gateway run.
      # Other rubrics upsert their stable run with the validated verdict.
      - name: Post the verdict check run
        if: steps.state.outputs.state == 'ok'
        continue-on-error: ${{ steps.enforcement.outputs.blocking != 'true' }}
        env:
          GH_TOKEN: ${{ steps.check-token.outputs.token }}
          CHECK_APP_SLUG: ${{ steps.check-token.outputs.app-slug }}
          BLOCKING: ${{ steps.enforcement.outputs.blocking }}
          CHECK_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$REVIEW_NAME" = policy-gate ] && [ -z "$GH_TOKEN" ]; then
            echo "::warning::policy-gate: cannot update the check run without an App token"
            exit 0
          fi
          case "$(cat policy-gate.exit):$BLOCKING" in 1:true) c=failure ;; 1:*) c=neutral ;; *) c=success ;; esac
          if [ "$REVIEW_NAME" = policy-gate ]; then
            # Best effort: the policy gate is comment-only, so a failed update must not fail it.
            bash .ai-workflows/.github/scripts/shared/check-run.sh update \
              "$REVIEW_NAME" "$c" "$REVIEW_TITLE" \
              "AI review verdict. Findings are in the pull request comment." \
              || echo "::warning::policy-gate: could not update the earlier check run"
          else
            bash .ai-workflows/.github/scripts/shared/check-run.sh upsert \
              "$REVIEW_NAME" "$c" "$REVIEW_TITLE" \
              "AI review verdict. Findings are in the pull request comment."
          fi

      - name: Enforce the verdict
        if: steps.enforcement.outputs.blocking == 'true' && steps.state.outputs.state == 'ok'
        run: |
          if [ "$(cat policy-gate.exit)" = "1" ]; then
            echo "::error::Policy gate failed at least one check; see the pull request comment."
            exit 1
          fi
