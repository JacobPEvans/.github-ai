# PR Reconcile Sweep
#
# Level-triggered guarantee for PR Reconcile: every five minutes at minutes
# 3, 8, 13 and so on, every open pull request of each listed owner is
# reconciled. Owners come from the PR_RECONCILE_OWNERS repository variable
# (comma-separated); nothing runs while it is empty.
#
# One job on the org's review runners sweeps every owner at once: nine jobs
# cannot start on the pool inside the five-minute interval. It logs in to OpenBao
# with this workflow's OIDC identity, then mints one installation token per
# owner, limited to actions (CI-fix dispatch), checks (read), contents, pull
# requests and statuses, inside the Reconcile step. No stored credential is used.

name: PR Reconcile Sweep

on:
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  owners:
    name: List owners
    runs-on: ubuntu-26.04
    permissions: {}
    timeout-minutes: 2
    outputs:
      owners: ${{ steps.list.outputs.owners }}
    steps:
      - name: List owners
        id: list
        env:
          OWNERS: ${{ vars.PR_RECONCILE_OWNERS }}
        run: echo "owners=$(jq -cn --arg o "$OWNERS" '$o | split(",") | map(gsub("\\s"; "")) | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  sweep:
    name: Sweep owners
    needs: owners
    if: needs.owners.outputs.owners != '[]'
    runs-on: review
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 10
    concurrency:
      group: pr-reconcile-sweep
      cancel-in-progress: false
    steps:
      - name: Checkout reconcile action and script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            .github/actions/pr-reconcile-run
            .github/scripts/pr-reconcile
          sparse-checkout-cone-mode: false
          path: .ai-workflows
          persist-credentials: false

      - name: Resolve OpenBao address
        id: bao
        run: |
          test -n "${OPENBAO_ADDR:-}" || { echo "::error::OPENBAO_ADDR is not set on this runner" >&2; exit 1; }
          echo "addr=$OPENBAO_ADDR" >> "$GITHUB_OUTPUT"

      - name: Log in to OpenBao
        id: login
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ steps.bao.outputs.addr }}
          method: jwt
          path: github-actions
          role: pr-reconcile-sweep
          jwtGithubAudience: openbao
          exportEnv: false
          exportToken: false
          outputToken: true

      # Callers run the fixers at v2, so that tag's commit is the fixer version the attempt records carry.
      - name: Resolve fixer version
        id: fixer
        run: echo "sha=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" refs/tags/v2 | cut -f1)" >> "$GITHUB_OUTPUT"

      # Second call site of reconcile.js beside pr-reconcile-run: it mints each owner token here so no token leaves this step.
      - name: Reconcile
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          BAO_ADDR: ${{ steps.bao.outputs.addr }}
          BAO_TOKEN: ${{ steps.login.outputs.vault_token }}
          SWEEP_OWNERS: ${{ needs.owners.outputs.owners }}
          RESOLVER_REPO: ${{ vars.PR_RECONCILE_RESOLVER_REPO }}
          CI_FIX_WORKFLOW: ${{ vars.PR_RECONCILE_CI_FIX_WORKFLOW }}
          FIXER_VERSION: ${{ steps.fixer.outputs.sha }}
          CI_FIX_SKIP_CHECKS: ${{ vars.PR_RECONCILE_CI_FIX_SKIP_CHECKS }}
          MERGE_ENABLED: ${{ vars.PR_RECONCILE_MERGE }}
          PR_RECONCILE_EXCLUDE_REPOS: ${{ secrets.PR_RECONCILE_EXCLUDE_REPOS }}
        with:
          script: |
            const permissions = { actions: 'write', checks: 'read', contents: 'write', pull_requests: 'write', statuses: 'write' };
            const run = require(`${process.env.GITHUB_WORKSPACE}/.ai-workflows/.github/scripts/pr-reconcile/reconcile.js`);
            async function sweep(owner) {
              const res = await fetch(`${process.env.BAO_ADDR}/v1/github/token`, {
                method: 'POST',
                headers: { 'X-Vault-Token': process.env.BAO_TOKEN },
                body: JSON.stringify({ org_name: owner, permissions }),
              });
              if (!res.ok) throw new Error(`Mint owner token: HTTP ${res.status}`);
              const token = (await res.json()).data?.token;
              if (!token) throw new Error('Mint owner token: no token in the response');
              core.setSecret(token);
              await run({ github: getOctokit(token), context, core, sweepOwner: owner });
            }
            // One owner's failure fails the job after every other owner has been swept.
            const owners = JSON.parse(process.env.SWEEP_OWNERS);
            const results = await Promise.allSettled(owners.map(sweep));
            results.forEach((result, index) => {
              if (result.status === 'rejected') core.setFailed(`sweep of ${owners[index]}: ${result.reason.message}`);
            });
