name: Dogfood Repository Hygiene Digest
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  actions: read
jobs:
  repo-hygiene-digest:
    # Runs only where a self-hosted runner and the router secrets exist for this
    # repository: set the repository variable DOGFOOD_SELF_HOSTED to 'true'.
    if: vars.DOGFOOD_SELF_HOSTED == 'true'
    uses: ./.github/workflows/repo-hygiene-digest.yml
    secrets:
      LLM_ROUTER_BASE_URL: ${{ secrets.LLM_ROUTER_BASE_URL }}
      LLM_ROUTER_API_KEY: ${{ secrets.LLM_ROUTER_API_KEY }}
      GH_SLACK_WEBHOOK_URL_GITHUB_AUTOMATION: ${{ secrets.GH_SLACK_WEBHOOK_URL_GITHUB_AUTOMATION }}
