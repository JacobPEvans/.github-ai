# Reusable: AI Merge Gate
#
# Status aggregator for secret scanning and blocking AI reviews.
# Branch protection requires only "AI Merge Gate" as the single AI check.
#
# The gate job publishes the verdict contract as one check run named
# "AI Merge Gate" on the pull request head, posted with the reviewer App
# token so rulesets can pin the App. Its summary prepends the first rubric
# line and carries exactly these contract lines:
#   model:         the model ids the reviews ran on, "override" for a review
#                  that passed through its rubric's override label, else "none"
#   author_family: the author's families, from the Assisted-by commit
#                  trailers of the pull request, else "unknown"
#   head:          the pull request head commit
#   VERDICT:       MERGE, CHANGES or DEFERRED
# The reviewer family is the family of the MODEL that wrote the review -
# the model id policy-gate called the router with, never the identity of
# the App that posts the check. A review from one of the author's own
# families is refused: no model reviews its own work. The comparison lives
# in the merge-gate mode of .github/scripts/policy-gate/validate-verdict.sh,
# with the model-to-family map in model-families.json next to it.
#
# Lane rule: before merge, _lane.yml classifies the pull request. In the
# standard and hot tiers the tiny and land-first lanes skip the model
# reviews and publish DEFERRED, and the bot lane never reviews and stays
# DEFERRED; the legacy tier, an empty lane, and the normal and guarded
# lanes keep today's full reviews. The secret scan runs in every lane.
# A closed event acts only when the pull request merged with the label
# checks:deferred: that post-merge run ignores the lane, runs every
# review, and publishes the real verdict on the pull request head for
# the auto-revert workflow. The summary also prints lane: <lane or none>
# after the head: line.
#
# A merge_group run carries no reviews of its own: one mechanical job reads
# the queue entry's pull request head and reports the required check name on
# the queue commit, passing only when the reviewer App's verdict check run
# already concluded there: success with VERDICT: MERGE, or neutral with
# VERDICT: DEFERRED.
#
# Usage:
#   uses: JacobPEvans/.github-ai/.github/workflows/_ai-merge-gate.yml@v1
name: _ai-merge-gate

on:
  workflow_call:
    inputs:
      runner_label:
        description: >-
          GitHub Actions runner label to run the job(s) on. Defaults to
          ubuntu-24.04. Pass a RunsOn label (see runs-on.com job labels
          docs) to opt the calling repo into self-hosted runners.
        type: string
        required: false
        default: ubuntu-24.04
      reviewer_app_slug:
        description: >-
          Slug of the GitHub App whose "AI Merge Gate" verdict check run the
          merge_group job accepts. Defaults to the reviewer App that
          publishes the check run.
        type: string
        required: false
        default: jpe-claude-bot
    secrets:
      LLM_ROUTER_BASE_URL:
        description: OpenAI-compatible base URL for the review router.
        required: false
      LLM_ROUTER_API_KEY:
        description: Scoped virtual key for the review router.
        required: false
      NTFY_BASE_URL:
        description: Optional base URL for policy-gate override audit notices.
        required: false
      GH_APP_CLAUDE_BOT_ID:
        description: App identifier, read when the organization variable of the same name is empty.
        required: false
      GH_APP_CLAUDE_BOT_PRIVATE_KEY:
        description: Private key used by policy-gate to publish review checks.
        required: false
      GITLEAKS_LICENSE_KEY:
        description: Org gitleaks-action license key; the scan fails closed without it.
        required: false
      AUTOMATION_APP_PRIVATE_KEY:
        description: lets the lane classifier grant the fast lanes; without it reviews run before merge
        required: false

concurrency:
  group: ai-merge-gate-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  checks: read
  contents: read
  pull-requests: write

jobs:
  lane:
    name: Lane classifier
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    uses: JacobPEvans/.github/.github/workflows/_lane.yml@topic/merge-flow-r2 # shortcut: follows the topic branch until _lane.yml is released under v1, then pin v1
    permissions:
      contents: read
      pull-requests: read
    secrets:
      AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

  gitleaks:
    name: Gitleaks secret scan
    if: github.event_name == 'pull_request' && (github.event.action != 'closed' || (github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'checks:deferred')))
    runs-on: ${{ inputs.runner_label || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE_KEY }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"

  router:
    name: Review router availability
    if: github.event_name == 'pull_request' && (github.event.action != 'closed' || (github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'checks:deferred')))
    runs-on: ${{ inputs.runner_label || 'ubuntu-24.04' }}
    timeout-minutes: 2
    permissions: {}
    outputs:
      available: ${{ steps.probe.outputs.available }}
    steps:
      - id: probe
        env:
          LLM_ROUTER_BASE_URL: ${{ secrets.LLM_ROUTER_BASE_URL }}
          LLM_ROUTER_API_KEY: ${{ secrets.LLM_ROUTER_API_KEY }}
        run: |
          if [[ -n "$LLM_ROUTER_BASE_URL" && -n "$LLM_ROUTER_API_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Router secrets are not passed to this caller; model reviews are skipped and only the secret scan gates."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

  # Public repos only. The gitleaks job still scans every repo for secrets.
  leak:
    name: Leak review
    needs: [router, lane]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (github.event.action != 'closed' || (github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'checks:deferred'))) && needs.router.outputs.available == 'true' && ((github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'checks:deferred')) || needs.lane.result != 'success' || (needs.lane.outputs.tier != 'standard' && needs.lane.outputs.tier != 'hot') || (needs.lane.outputs.lane != 'tiny' && needs.lane.outputs.lane != 'land-first' && needs.lane.outputs.lane != 'bot')) && !github.event.repository.private }}
    uses: ./.github/workflows/policy-gate.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      rubric: leak
      model: standard
      max_tokens: 4000
      max_diff_kb: 150
      blocking: true
      runner_label: ${{ inputs.runner_label }}
    secrets:
      LLM_ROUTER_BASE_URL: ${{ secrets.LLM_ROUTER_BASE_URL }}
      LLM_ROUTER_API_KEY: ${{ secrets.LLM_ROUTER_API_KEY }}
      NTFY_BASE_URL: ${{ secrets.NTFY_BASE_URL }}
      GH_APP_CLAUDE_BOT_ID: ${{ secrets.GH_APP_CLAUDE_BOT_ID }}
      GH_APP_CLAUDE_BOT_PRIVATE_KEY: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}

  security:
    name: Security review
    needs: [router, lane]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (github.event.action != 'closed' || (github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'checks:deferred'))) && needs.router.outputs.available == 'true' && ((github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'checks:deferred')) || needs.lane.result != 'success' || (needs.lane.outputs.tier != 'standard' && needs.lane.outputs.tier != 'hot') || (needs.lane.outputs.lane != 'tiny' && needs.lane.outputs.lane != 'land-first' && needs.lane.outputs.lane != 'bot')) }}
    uses: ./.github/workflows/policy-gate.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      rubric: security
      model: critical
      blocking: true
      runner_label: ${{ inputs.runner_label }}
    secrets:
      LLM_ROUTER_BASE_URL: ${{ secrets.LLM_ROUTER_BASE_URL }}
      LLM_ROUTER_API_KEY: ${{ secrets.LLM_ROUTER_API_KEY }}
      NTFY_BASE_URL: ${{ secrets.NTFY_BASE_URL }}
      GH_APP_CLAUDE_BOT_ID: ${{ secrets.GH_APP_CLAUDE_BOT_ID }}
      GH_APP_CLAUDE_BOT_PRIVATE_KEY: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}

  semantic:
    name: Semantic review
    needs: [router, lane]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (github.event.action != 'closed' || (github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'checks:deferred'))) && needs.router.outputs.available == 'true' && ((github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'checks:deferred')) || needs.lane.result != 'success' || (needs.lane.outputs.tier != 'standard' && needs.lane.outputs.tier != 'hot') || (needs.lane.outputs.lane != 'tiny' && needs.lane.outputs.lane != 'land-first' && needs.lane.outputs.lane != 'bot')) }}
    uses: ./.github/workflows/policy-gate.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      rubric: semantic
      model: standard
      blocking: true
      runner_label: ${{ inputs.runner_label }}
    secrets:
      LLM_ROUTER_BASE_URL: ${{ secrets.LLM_ROUTER_BASE_URL }}
      LLM_ROUTER_API_KEY: ${{ secrets.LLM_ROUTER_API_KEY }}
      NTFY_BASE_URL: ${{ secrets.NTFY_BASE_URL }}
      GH_APP_CLAUDE_BOT_ID: ${{ secrets.GH_APP_CLAUDE_BOT_ID }}
      GH_APP_CLAUDE_BOT_PRIVATE_KEY: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}

  # Advisory: posts its comment and check, never fails, and the final check does not wait for it.
  code:
    name: Code review
    needs: [router, lane]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (github.event.action != 'closed' || (github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'checks:deferred'))) && needs.router.outputs.available == 'true' && ((github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'checks:deferred')) || needs.lane.result != 'success' || (needs.lane.outputs.tier != 'standard' && needs.lane.outputs.tier != 'hot') || (needs.lane.outputs.lane != 'tiny' && needs.lane.outputs.lane != 'land-first' && needs.lane.outputs.lane != 'bot')) }}
    uses: ./.github/workflows/policy-gate.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      rubric: code
      model: standard
      blocking: false
      runner_label: ${{ inputs.runner_label }}
    secrets:
      LLM_ROUTER_BASE_URL: ${{ secrets.LLM_ROUTER_BASE_URL }}
      LLM_ROUTER_API_KEY: ${{ secrets.LLM_ROUTER_API_KEY }}
      NTFY_BASE_URL: ${{ secrets.NTFY_BASE_URL }}
      GH_APP_CLAUDE_BOT_ID: ${{ secrets.GH_APP_CLAUDE_BOT_ID }}
      GH_APP_CLAUDE_BOT_PRIVATE_KEY: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}

  gate:
    name: AI Merge Gate
    if: always() && github.event_name == 'pull_request' && (github.event.action != 'closed' || (github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'checks:deferred')))
    needs: [gitleaks, router, leak, security, semantic, lane]
    runs-on: ${{ inputs.runner_label || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
    env:
      IS_DRAFT: ${{ github.event.pull_request.draft }}
      REPO_PRIVATE: ${{ github.event.repository.private }}
      ROUTER_AVAILABLE: ${{ needs.router.outputs.available }}
      LANE: ${{ needs.lane.outputs.lane }}
      TIER: ${{ needs.lane.outputs.tier }}
      LANE_RESULT: ${{ needs.lane.result }}
      POST_MERGE: ${{ github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'checks:deferred') && 'true' || 'false' }}
      GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
      LEAK_RESULT: ${{ needs.leak.result }}
      SECURITY_RESULT: ${{ needs.security.result }}
      SEMANTIC_RESULT: ${{ needs.semantic.result }}
      # The model id each review ran on, passed through policy-gate.yml's
      # reviewer_model output. Empty for a review that never ran or was
      # overridden. The status says which: "override" marks a review that
      # passed through its rubric's override label, which counts as passed
      # without the reviewer family rule.
      LEAK_MODEL: ${{ needs.leak.outputs.reviewer_model }}
      SECURITY_MODEL: ${{ needs.security.outputs.reviewer_model }}
      SEMANTIC_MODEL: ${{ needs.semantic.outputs.reviewer_model }}
      LEAK_STATUS: ${{ needs.leak.outputs.verdict_status }}
      SECURITY_STATUS: ${{ needs.security.outputs.verdict_status }}
      SEMANTIC_STATUS: ${{ needs.semantic.outputs.verdict_status }}
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      # The pull request checkout below is metadata only: the gate reads
      # commit trailers with git log and never executes anything from it.
      # The full history is needed so the base commit is present for the
      # base..head range.
      - name: Checkout the pull request head for commit metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout ai-workflows scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: JacobPEvans/.github-ai
          ref: ${{ fromJSON(toJSON(job))['workflow_sha'] }}
          sparse-checkout: .github/scripts
          path: .ai-workflows
          persist-credentials: false

      # The check run is posted with the Claude bot App token, so rulesets can
      # require the "AI Merge Gate" check from that App. Same mint as the
      # policy-gate gate job; a failed mint is named by the publish step.
      - name: Mint the check-run token
        id: check-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.GH_APP_CLAUDE_BOT_ID || secrets.GH_APP_CLAUDE_BOT_ID }}
          private-key: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}
          permission-checks: write

      # The API occasionally returns a transient HTML error page; piping it
      # straight into --jq crashed the gate (false-negative merge block).
      # Retry with backoff and require a numeric answer before judging. The
      # count feeds the verdict step, so failed Copilot checks still yield a
      # published CHANGES verdict instead of dying before the check run.
      - name: Count failed Copilot agent checks
        id: copilot
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            FAILED=$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}/check-runs" \
              --jq '[.check_runs[] | select(.app.slug | test("copilot"; "i")) | select(.conclusion == "failure" or .conclusion == "timed_out")] | length') && break
            sleep $((i * 5))
          done
          if ! [[ "$FAILED" =~ ^[0-9]+$ ]]; then
            echo "copilot_failures=unreadable" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "copilot_failures=$FAILED" >> "$GITHUB_OUTPUT"

      - name: Determine the author family
        id: author-family
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          FAMILIES_FILE: .ai-workflows/.github/scripts/policy-gate/model-families.json
        run: |
          set -euo pipefail
          # One family per model vendor, from the shared map. The definition
          # of family_of lives once, in family-of.jq next to
          # model-families.json; validate-verdict.sh includes the same file.
          families_dir="${FAMILIES_FILE%/*}"
          family_of() {
            jq -rn -L "$families_dir" --slurpfile families "$FAMILIES_FILE" --arg model "$1" \
              'include "family-of"; $model | family_of'
          }

          # A human-pushed pull request can still carry agent-written commits:
          # the Assisted-by trailer names the model that wrote each one, and
          # the range between the base and the head is the whole change.
          if ! trailers="$(git log --format='%(trailers:key=Assisted-by,valueonly)' "$BASE_SHA..$HEAD_SHA")"; then
            echo "::error::Could not read the pull request commits to determine the author family"
            exit 1
          fi
          author_family="$(printf '%s\n' "$trailers" |
            while IFS= read -r trailer; do
              case "$trailer" in
                (*:*) family_of "${trailer#*:}" ;;
              esac
            done |
            sort -u | paste -sd+ -)"
          [[ -n "$author_family" ]] || author_family=unknown
          echo "author_family=$author_family" >> "$GITHUB_OUTPUT"

      - name: Compute the merge gate verdict
        id: verdict
        env:
          COPILOT_FAILURES: ${{ steps.copilot.outputs.copilot_failures }}
          COPILOT_OUTCOME: ${{ steps.copilot.outcome }}
          AUTHOR_FAMILY: ${{ steps.author-family.outputs.author_family }}
        run: |
          set -euo pipefail
          # CHANGES when any required scan or review failed, was skipped for a
          # non-draft pull request with a router, when a Copilot agent check
          # failed or was unreadable, or when the reviewer family is unknown
          # or shared with the author family. DEFERRED when the gate otherwise
          # passed with reviews skipped on a draft pull request or without a
          # router, or with reviews skipped before merge in the tiny,
          # land-first or bot lane of a standard/hot-tier repository (the
          # secret scan is never excused by the lane). MERGE only when every
          # review ran and passed. A post-merge run ignores the lane and the
          # draft flag: a merged pull request is never a draft.
          leak_result="$LEAK_RESULT"
          if [[ "$REPO_PRIVATE" == "true" && "$leak_result" == "skipped" ]]; then
            leak_result=success
          fi
          verdict=MERGE
          reason=""
          deferred=false
          if [[ "$COPILOT_OUTCOME" != "success" || "$COPILOT_FAILURES" == "unreadable" ]]; then
            verdict=CHANGES
            reason="the Copilot agent checks could not be read"
          elif [[ "$COPILOT_FAILURES" != "0" ]]; then
            verdict=CHANGES
            reason="$COPILOT_FAILURES Copilot agent check(s) failed"
          fi
          # The lane only excuses a skipped review before merge, and only in
          # the standard and hot tiers; legacy and an unclassified pull
          # request keep the full rule, and so does a classifier that did not
          # succeed. After merge the reviews always run; without a router
          # they cannot, and the verdict stays DEFERRED, which the post-merge
          # workflow treats as red once its wait ends.
          is_draft="$IS_DRAFT"
          lane_deferred=false
          if [[ "$POST_MERGE" == "true" ]]; then
            is_draft=false
          elif [[ "$LANE_RESULT" == "success" && ( "$TIER" == "standard" || "$TIER" == "hot" ) && ( "$LANE" == "tiny" || "$LANE" == "land-first" || "$LANE" == "bot" ) ]]; then
            lane_deferred=true
          fi
          for entry in "gitleaks|$GITLEAKS_RESULT" "review|$leak_result" "review|$SECURITY_RESULT" "review|$SEMANTIC_RESULT"; do
            kind="${entry%%|*}"
            result="${entry#*|}"
            case "$result" in
              success)
                ;;
              skipped)
                if [[ "$kind" == "review" && "$lane_deferred" == true ]]; then
                  deferred=true
                elif [[ "$is_draft" != "true" && "$ROUTER_AVAILABLE" == "true" ]]; then
                  verdict=CHANGES
                  reason="${reason:-a required scan or review was skipped for a non-draft pull request}"
                else
                  deferred=true
                fi
                ;;
              failure|cancelled)
                verdict=CHANGES
                reason="${reason:-a required scan or review concluded with $result}"
                ;;
              *)
                verdict=CHANGES
                reason="${reason:-a required scan or review has an unexpected conclusion: $result}"
                ;;
            esac
          done

          # The reviewer is the MODEL that wrote each review, the model id
          # policy-gate called the router with - never the App that posts the
          # check. A review that passed through its rubric's override label
          # counts as passed and is named "override"; the family rule in the
          # validator does not apply to it. A review that ran without a model
          # id leaves the model list empty and refuses the gate below; with
          # no review at all the family rule has nothing to compare and the
          # model line reads "none".
          models=""
          missing_model=false
          for pair in "$LEAK_RESULT|$LEAK_STATUS|$LEAK_MODEL" "$SECURITY_RESULT|$SECURITY_STATUS|$SECURITY_MODEL" "$SEMANTIC_RESULT|$SEMANTIC_STATUS|$SEMANTIC_MODEL"; do
            result="${pair%%|*}"
            model_status="${pair#*|}"
            status="${model_status%%|*}"
            model="${model_status#*|}"
            if [[ "$status" == "override" ]]; then
              models+="override"$'\n'
            elif [[ "$result" == "success" ]]; then
              if [[ -n "$model" ]]; then
                models+="$model"$'\n'
              else
                missing_model=true
              fi
            fi
          done
          if [[ "$missing_model" == true ]]; then
            model_value=""
          elif [[ -z "$models" ]]; then
            model_value="none"
          else
            model_value="$(printf '%s' "$models" | jq -rRs 'rtrimstr("\n") | split("\n") | unique | join(", ")')"
          fi
          if [[ "$verdict" == MERGE && "$deferred" == true ]]; then
            verdict=DEFERRED
          fi
          jq -n \
            --arg model "$model_value" \
            --arg author_family "$AUTHOR_FAMILY" \
            --arg head "$HEAD_SHA" \
            --arg verdict "$verdict" \
            '{model: $model, author_family: $author_family, head: $head, verdict: $verdict}' \
            > ai-merge-gate.verdict.json
          # validate-verdict.sh merge-gate mode owns the family comparison. It
          # refuses with CHANGES when the reviewer family is unknown or in the
          # author's set, keeps the scan reason otherwise, and rewrites the
          # verdict in place when it refuses.
          RUBRIC=merge-gate RESPONSE_FILE=ai-merge-gate.verdict.json MERGE_GATE_REASON="$reason" \
            bash .ai-workflows/.github/scripts/policy-gate/validate-verdict.sh
          verdict="$(jq -r '.verdict' ai-merge-gate.verdict.json)"
          case "$verdict" in
            MERGE) conclusion=success ;;
            CHANGES) conclusion=failure ;;
            DEFERRED) conclusion=neutral ;;
          esac
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"

      - name: Publish the AI Merge Gate verdict
        id: publish
        env:
          GH_TOKEN: ${{ steps.check-token.outputs.token }}
          CHECK_APP_SLUG: ${{ steps.check-token.outputs.app-slug }}
          CHECK_HEAD_SHA: ${{ env.HEAD_SHA }}
          GATE_CONCLUSION: ${{ steps.verdict.outputs.conclusion }}
          GATE_REASON: ${{ steps.verdict.outputs.reason }}
          VERDICT_FILE: ai-merge-gate.verdict.json
          SUMMARY_FILE: ai-merge-gate.summary.md
          RUBRIC_LINE: A change that adds or edits a script or custom unit where a native or maintained way exists is CHANGES.
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::ai-merge-gate: cannot publish the verdict check run without an App token"
            exit 0
          fi
          {
            printf '%s\n\n' "$RUBRIC_LINE"
            printf 'model: %s\n' "$(jq -r '.model' "$VERDICT_FILE")"
            printf 'author_family: %s\n' "$(jq -r '.author_family' "$VERDICT_FILE")"
            printf 'head: %s\n' "$(jq -r '.head' "$VERDICT_FILE")"
            printf 'lane: %s\n' "${LANE:-none}"
            # On a refusal the reason is the last summary line before VERDICT.
            if [ -n "$GATE_REASON" ]; then
              printf 'reason: %s\n' "$GATE_REASON"
            fi
            printf 'VERDICT: %s\n' "$(jq -r '.verdict' "$VERDICT_FILE")"
          } > "$SUMMARY_FILE"
          bash .ai-workflows/.github/scripts/shared/check-run.sh upsert \
            "AI Merge Gate" "$GATE_CONCLUSION" "AI Merge Gate" "$(cat "$SUMMARY_FILE")"

      - name: Enforce the gate verdict
        id: enforce
        env:
          GATE_VERDICT: ${{ steps.verdict.outputs.verdict }}
          GATE_REASON: ${{ steps.verdict.outputs.reason }}
        run: |
          if [ "$GATE_VERDICT" = "CHANGES" ]; then
            echo "::error::AI Merge Gate: CHANGES - ${GATE_REASON:-the verdict requires changes}."
            exit 1
          fi
          echo "AI Merge Gate verdict: $GATE_VERDICT"

  # The merge queue's mechanical check: an entry is queued only after its
  # required checks passed, so the verdict check run already exists on the
  # pull request head. This job re-reads it and reports the same check name
  # the ruleset requires on the queue commit, once - no model call.
  merge-group:
    name: AI Merge Gate
    if: github.event_name == 'merge_group'
    runs-on: ${{ inputs.runner_label || 'ubuntu-24.04' }}
    timeout-minutes: 2
    permissions:
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Mint the check-run token
        id: check-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.GH_APP_CLAUDE_BOT_ID || secrets.GH_APP_CLAUDE_BOT_ID }}
          private-key: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}
          permission-checks: write

      - name: Checkout ai-workflows scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: JacobPEvans/.github-ai
          ref: ${{ fromJSON(toJSON(job))['workflow_sha'] }}
          sparse-checkout: .github/scripts
          path: .ai-workflows
          persist-credentials: false

      - name: Verify the queued entry already carries its verdict
        id: queue-verdict
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ steps.check-token.outputs.token }}
          CHECK_APP_SLUG: ${{ steps.check-token.outputs.app-slug }}
          CHECK_HEAD_SHA: ${{ github.event.merge_group.head_sha || github.sha }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          REPO_TOKEN: ${{ github.token }}
          REVIEWER_APP_SLUG: ${{ inputs.reviewer_app_slug }}
        run: |
          set -euo pipefail
          # The queue branch is [refs/heads/]gh-readonly-queue/<base>/pr-<number>-<sha>.
          # Only the number is taken from it; the pull request head the verdict
          # was posted on is read from the API below.
          HEAD_SHA=unknown
          if [[ "$HEAD_REF" =~ gh-readonly-queue/.+/pr-([0-9]+)-[0-9a-f]+$ ]]; then
            PR_NUMBER=${BASH_REMATCH[1]}
          else
            echo "::error::AI Merge Gate: unexpected queue branch '$HEAD_REF'; expected gh-readonly-queue/<base>/pr-<number>-<sha>"
            bash .ai-workflows/.github/scripts/shared/check-run.sh upsert \
              "AI Merge Gate" failure "AI Merge Gate" \
              "unexpected queue branch '$HEAD_REF'; expected gh-readonly-queue/<base>/pr-<number>-<sha>"
            exit 1
          fi
          # The gate reports the ruleset's required check from the reviewer
          # App; without a minted token this job cannot report it at all.
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::AI Merge Gate: pull request #$PR_NUMBER (head $HEAD_SHA): cannot report the verdict without an App token"
            exit 1
          fi
          # A refusal reports failure under the same check name and fails the
          # job, so the queue entry never waits on a verdict that will never
          # arrive.
          refuse() {
            echo "::error::AI Merge Gate: pull request #$PR_NUMBER (head $HEAD_SHA): $1"
            bash .ai-workflows/.github/scripts/shared/check-run.sh upsert \
              "AI Merge Gate" failure "AI Merge Gate" "pull request #$PR_NUMBER (head $HEAD_SHA): $1"
            exit 1
          }
          HEAD_SHA="$(GH_TOKEN="$REPO_TOKEN" gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)" || HEAD_SHA=""
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            HEAD_SHA=unknown
            refuse "could not read its head commit"
          fi
          # The API occasionally returns a transient HTML error page; retry
          # with backoff and judge only a readable response, as the gate does.
          RUNS=""
          for i in 1 2 3; do
            RUNS=$(gh api -X GET \
              "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs" \
              -f check_name="AI Merge Gate" \
              -f filter=latest \
              -f per_page=100) && break
            sleep $((i * 5))
          done
          if [ -z "$RUNS" ]; then
            refuse "could not read its check runs"
          fi
          if ! RUN="$(jq -r --arg name "AI Merge Gate" --arg slug "$REVIEWER_APP_SLUG" \
            '(if type == "array" then . else (.check_runs // []) end)
             | map(select(.name == $name and .app.slug == $slug))
             | first // empty' <<< "$RUNS" 2>/dev/null)"; then
            refuse "the check-run lookup returned an unreadable response"
          fi
          if [ -z "$RUN" ]; then
            refuse "carries no 'AI Merge Gate' check run from the reviewer App $REVIEWER_APP_SLUG"
          fi
          CONCLUSION="$(jq -r '.conclusion // ""' <<< "$RUN")"
          SUMMARY="$(jq -r '.output.summary // ""' <<< "$RUN")"
          if ! VERDICT_LINE="$(grep -xE 'VERDICT: (MERGE|DEFERRED)' <<< "$SUMMARY" | tail -n 1)"; then
            refuse "verdict summary carries no 'VERDICT: MERGE' or 'VERDICT: DEFERRED' line (check run concluded '${CONCLUSION:-none}')"
          fi
          # The gate publishes MERGE as success and DEFERRED as neutral; any
          # other pairing is not a verdict the gate wrote.
          if [[ "$CONCLUSION/$VERDICT_LINE" != "success/VERDICT: MERGE" && "$CONCLUSION/$VERDICT_LINE" != "neutral/VERDICT: DEFERRED" ]]; then
            refuse "verdict check run concluded '${CONCLUSION:-none}' with '$VERDICT_LINE'"
          fi
          echo "AI Merge Gate: pull request #$PR_NUMBER (head $HEAD_SHA) carries an accepted verdict: $VERDICT_LINE"
          bash .ai-workflows/.github/scripts/shared/check-run.sh upsert \
            "AI Merge Gate" success "AI Merge Gate" \
            "pull request #$PR_NUMBER (head $HEAD_SHA) carries $VERDICT_LINE from the reviewer App $REVIEWER_APP_SLUG"
