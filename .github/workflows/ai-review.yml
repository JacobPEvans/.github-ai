# Org-wide AI review of every pull request, enforced via Required Workflows.
#
# Referenced by dryvist/tofu-github's github_organization_ruleset
# (`org-ai-review`), which injects this workflow into the pull requests of
# EVERY repo in the org — no per-repo `uses:` caller, so a repo cannot opt out
# by omission. It mirrors markdownlint.yml (the proven required-workflow
# pattern) and defers the actual review to JacobPEvans/.github-ai' reusable
# PR-Agent workflow, which reads each repo's own `.pr_agent.toml` for its
# checklist.
#
# Every review runs on the shared self-hosted pool against the org's model
# router — the only runners that reach it. Repository visibility picks the
# router key, as data on the one call below, never a second job: a private
# repo reviews with LLM_ROUTER_API_KEY, an open-source repo with
# LLM_ROUTER_OSS_API_KEY, a second router key scoped to the open-source role.
# The reusable workflow picks the matching role (`model` / `oss_model`)
# from the same expression, and each role carries its own fallback ladder on
# the router — local models first — so where a diff may travel is decided by
# the role and the key that may call it, never here. All three router secrets
# are org secrets synced from the secret manager; the reusable workflow never
# reads the open-source key on a private repo. GH_APP_CLAUDE_BOT_PRIVATE_KEY
# mints the token that posts the failure check run after a router failure.
#
# A router that is down or at capacity fails the review within seconds —
# never a green check that reviewed nothing. Whether that failure blocks the
# merge is the ruleset's enforcement mode (tofu-github), not this file's.
#
# No concurrency block here on purpose: the reusable workflow already scopes
# its group per pull request, and a caller sharing that exact group causes an
# opaque 0-job startup_failure.
#
# `scope` (JacobPEvans/.github-ai' content-aware scope-classify.yml, "Jev")
# runs unconditionally and gates `pr-agent` on its `ai_review` output. The
# required workflow itself always completes (`dependency-bot` or `pr-agent`
# always runs); only whether `pr-agent`'s review job runs is narrowed. A
# scope failure, or `ai_review` answering anything but `no`, still runs the
# review - "the classifier is unreachable" behaves like "review everything",
# never like "skip the review".
name: AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  scope:
    name: Classify CI scope (Jev)
    permissions:
      contents: read
      pull-requests: read
    uses: JacobPEvans/.github-ai/.github/workflows/scope-classify.yml@v1
    secrets:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}

  # Renovate and release-please pull requests are version bumps and
  # changelog/lockfile edits by construction; a model review of them answers
  # nothing. For those authors the workflow still runs — this job, on a
  # GitHub-hosted runner, with no secret and no model — so the required
  # workflow completes successfully in seconds instead of relying on how a
  # skipped run is judged. Author, not actor: a reopen or a rebase is
  # performed by whoever clicked, the author stays the bot.
  dependency-bot:
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' ||
      github.event.pull_request.user.login == 'jacobpevans-release-please[bot]'
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 30 }}
    steps:
      - name: Dependency or release pull request
        run: echo "Not reviewed by a model - the author is a dependency or release bot."

  pr-agent:
    needs: scope
    # Deferring only on a definitive scope success saying "no" - a scope
    # failure or any other answer still runs the review.
    if: >-
      !cancelled() &&
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.user.login != 'jacobpevans-release-please[bot]' &&
      (needs.scope.result != 'success' || needs.scope.outputs.ai_review != 'no')
    permissions:
      contents: read
      pull-requests: write
    uses: JacobPEvans/.github-ai/.github/workflows/pr-agent.yml@v1
    with:
      review: true
      # Open-source repositories request review-oss.
      oss_model: review-oss
      # improve stays off: over 84 org-wide runs (2026-09-18/19) it took a
      # median 62 s of model time per pull request — more than the review
      # itself — and produced "No code suggestions" three times out of four.
      # A repository that wants suggestions opts in through its own caller.
    secrets:
      LLM_ROUTER_BASE_URL: ${{ secrets.LLM_ROUTER_BASE_URL }}
      LLM_ROUTER_API_KEY: ${{ secrets.LLM_ROUTER_API_KEY }}
      LLM_ROUTER_OSS_API_KEY: ${{ secrets.LLM_ROUTER_OSS_API_KEY }}
      GH_APP_CLAUDE_BOT_PRIVATE_KEY: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}
