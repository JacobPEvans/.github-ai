# Org-wide AI review of every pull request, enforced via Required Workflows.
#
# This entry has no inputs or secrets. It keeps the scope classifier, bot skip,
# and fork guard, then runs the shared PR-Agent runner with the central rubric.
# The OpenBao role binds to this workflow's OIDC identity, so its credential
# lookup lives in this workflow instead of the reusable workflow below.
name: AI Review

# Each value is a vault-action selector: `<mount>/data/<path> <field>`, readable by the ci-ai-review policy.
env:
  OPENBAO_ROUTER_KEY_PATH: "secret/data/apps/github-actions-pr-review github_actions_pr_review_llm_router_key"
  OPENBAO_ROUTER_OSS_KEY_PATH: "secret/data/apps/github-actions-oss github_actions_oss_llm_router_key"
  OPENBAO_ROUTER_URL_PATH: "config/data/ci-ai-review base_url"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  scope:
    name: Classify CI scope (Jev)
    permissions:
      contents: read
      pull-requests: read
    uses: JacobPEvans/.github-ai/.github/workflows/scope-classify.yml@v2
    secrets:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}

  # Renovate and release-please pull requests are version bumps and
  # changelog/lockfile edits by construction; a model review of them answers
  # nothing. This job needs neither credentials nor a model.
  dependency-bot:
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' ||
      github.event.pull_request.user.login == 'jacobpevans-release-please[bot]'
    runs-on: ubuntu-26.04
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Dependency or release pull request
        run: echo "Not reviewed by a model - the author is a dependency or release bot."

  pr-agent:
    needs: scope
    # Deferring only on a definitive scope success saying "no" - a scope
    # failure or any other answer still runs the review. A fork is rejected
    # before this job can obtain its OIDC token.
    # In this repository's own pull requests the job runs only when
    # DOGFOOD_SELF_HOSTED is 'true'; it has no self-hosted runner otherwise.
    if: >-
      !cancelled() &&
      (github.repository != 'JacobPEvans/.github-ai' || vars.DOGFOOD_SELF_HOSTED == 'true') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.user.login != 'jacobpevans-release-please[bot]' &&
      (needs.scope.result != 'success' || needs.scope.outputs.ai_review != 'no')
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    timeout-minutes: 5
    steps:
      # Check out only this workflow's central scripts and rubric. No pull
      # request branch or code is checked out or executed while credentials exist.
      - name: Checkout PR-Agent scripts and rubric
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: JacobPEvans/.github-ai
          ref: ${{ fromJSON(toJSON(job))['workflow_sha'] }}
          sparse-checkout: |
            .github/scripts
            .github/actions/router-creds
            pr-agent/rubric.toml
          sparse-checkout-cone-mode: false
          path: .ai-workflows
          persist-credentials: false

      - name: Read PR-Agent router credentials from OpenBao
        id: router-creds
        uses: ./.ai-workflows/.github/actions/router-creds
        with:
          key-path: ${{ env.OPENBAO_ROUTER_KEY_PATH }}
          oss-key-path: ${{ env.OPENBAO_ROUTER_OSS_KEY_PATH }}
          url-path: ${{ env.OPENBAO_ROUTER_URL_PATH }}

      - name: Run PR-Agent review
        env:
          BASE_URL: ${{ steps.router-creds.outputs.base-url }}
          API_KEY: ${{ steps.router-creds.outputs.api-key }}
          JOB_TOKEN: ${{ github.token }}
          MODEL: ${{ github.event.repository.private && 'medium' || 'review-oss' }}
          MAX_TOKENS: 32000
          JOB_TIMEOUT_MINUTES: 5
          RUBRIC_FILE: ${{ github.workspace }}/.ai-workflows/pr-agent/rubric.toml
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_REVIEW: 'true'
          RUN_IMPROVE: 'false'
          RUN_DESCRIBE: 'false'
        run: bash .ai-workflows/.github/scripts/pr-agent/run.sh

  # The merge verdict: the code rubric, answered by a model of a different family
  # than every commit's Assisted-by trailer names, at the event's exact head. It
  # passes on a clean verdict and fails on anything else, including an unknown
  # author model, a moved head or a router failure. Dependency and release bots
  # pass without a model, like the dependency-bot job above.
  verdict:
    name: verdict/merge
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    concurrency:
      group: verdict-merge-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    timeout-minutes: 5
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # Data only: the diff is read, no pull request code runs in this job.
      # Checked out first, at the root, because a root checkout clears the
      # workspace.
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout verdict scripts and actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: JacobPEvans/.github-ai
          ref: ${{ fromJSON(toJSON(job))['workflow_sha'] }}
          sparse-checkout: |
            .github/scripts
            .github/actions/router-creds
            .github/actions/rubric-verdict
            .github/actions/checkout-prompts
          sparse-checkout-cone-mode: false
          path: .ai-workflows
          persist-credentials: false

      - name: Read router credentials from OpenBao
        id: router-creds
        uses: ./.ai-workflows/.github/actions/router-creds
        with:
          key-path: ${{ env.OPENBAO_ROUTER_KEY_PATH }}
          oss-key-path: ${{ env.OPENBAO_ROUTER_OSS_KEY_PATH }}
          url-path: ${{ env.OPENBAO_ROUTER_URL_PATH }}

      - name: List the models the router serves for this key
        id: served
        env:
          BASE_URL: ${{ steps.router-creds.outputs.base-url }}
          API_KEY: ${{ steps.router-creds.outputs.api-key }}
        run: bash .ai-workflows/.github/scripts/verdict/served-models.sh

      - name: Pick a reviewer of another model family
        id: pick
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          VISIBILITY: ${{ github.event.repository.private && 'private' || 'public' }}
          ROUTER_MODELS: ${{ steps.served.outputs.models }}
          FAMILIES_FILE: .ai-workflows/.github/scripts/verdict/model-families.json
        with:
          script: |
            const run = require('./.ai-workflows/.github/scripts/verdict/pick-reviewer.js');
            await run({ github, context, core });

      - name: Checkout prompt catalog
        if: steps.pick.outputs.skip != 'true'
        uses: ./.ai-workflows/.github/actions/checkout-prompts
        with:
          sparse-checkout: automation/ai-workflows-code-review.prompt.yml

      - name: Request the code verdict
        id: verdict
        if: steps.pick.outputs.skip != 'true'
        uses: ./.ai-workflows/.github/actions/rubric-verdict
        with:
          rubric: code
          prompt-name: code-review
          model: ${{ steps.pick.outputs.model }}
          endpoint: ${{ steps.router-creds.outputs.base-url }}
          token: ${{ steps.router-creds.outputs.api-key }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ env.HEAD_SHA }}

      - name: Decide the verdict
        if: steps.pick.outputs.skip != 'true'
        env:
          OUTCOME: ${{ steps.verdict.outputs.outcome }}
          RESPONSE_FILE: ${{ steps.verdict.outputs.response-file }}
          MODEL: ${{ steps.pick.outputs.model }}
          FAMILY: ${{ steps.pick.outputs.family }}
          AUTHOR_FAMILIES: ${{ steps.pick.outputs.author_families }}
        run: bash .ai-workflows/.github/scripts/verdict/decide.sh
