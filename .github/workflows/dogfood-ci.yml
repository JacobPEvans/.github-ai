name: AI CI

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

permissions: {}

concurrency:
  group: ai-ci-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false  # Never cancel — queue instead to avoid wasting AI tokens

jobs:
  ci-suite:
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    uses: JacobPEvans/.github-ai/.github/workflows/suite-ci.yml@v2
    with:
      repo_context: "Reusable GitHub Actions workflows for AI-powered CI/CD automation (prompts, scripts, YAML workflows)"
      ci_structure: "test.yml (bun test for JavaScript scripts)"
      workflow_name: "Tests"
    secrets:
      LLM_ROUTER_BASE_URL: ${{ secrets.LLM_ROUTER_BASE_URL }}
      LLM_ROUTER_API_KEY: ${{ secrets.LLM_ROUTER_API_KEY }}
      GH_APP_CLAUDE_BOT_PRIVATE_KEY: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}
