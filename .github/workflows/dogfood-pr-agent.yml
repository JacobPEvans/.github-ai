name: Dogfood PR Agent
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
jobs:
  # Local ref on purpose: the pull request's own version of the workflow is
  # what should run. `describe` stays off — the pull request body carries a
  # provenance footer this repository owns.
  pr-agent:
    # Runs only where a self-hosted runner and the router secrets exist for this
    # repository: set the repository variable DOGFOOD_SELF_HOSTED to 'true'.
    if: vars.DOGFOOD_SELF_HOSTED == 'true'
    uses: ./.github/workflows/pr-agent.yml
    with:
      review: true
      improve: true
    secrets:
      LLM_ROUTER_BASE_URL: ${{ secrets.LLM_ROUTER_BASE_URL }}
      LLM_ROUTER_API_KEY: ${{ secrets.LLM_ROUTER_API_KEY }}
      LLM_ROUTER_OSS_API_KEY: ${{ secrets.LLM_ROUTER_OSS_API_KEY }}
      NTFY_BASE_URL: ${{ secrets.NTFY_BASE_URL }}
      GH_APP_CLAUDE_BOT_PRIVATE_KEY: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}
