name: Dogfood Code Simplifier
on:
  workflow_dispatch:
  # --- DISABLED AUTOMATIC TRIGGERS (restore by uncommenting) ---
  # schedule:
  #   - cron: "0 4 * * *"
  # --- END DISABLED ---
permissions: {}
jobs:
  simplify:
    permissions:
      actions: read
      contents: write
      pull-requests: write
    uses: JacobPEvans/.github-ai/.github/workflows/cc-code-simplifier.yml@v2
    with:
      runner_label: review
    secrets:
      LLM_ROUTER_BASE_URL: ${{ secrets.LLM_ROUTER_BASE_URL }}
      LLM_ROUTER_API_KEY: ${{ secrets.LLM_ROUTER_API_KEY }}
      GH_APP_CLAUDE_BOT_PRIVATE_KEY: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}
