name: Dogfood Scope Classify
on:
  pull_request:
    types: [opened, synchronize, reopened]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  # Unit tests for scripts/scope_classify.py - mocks the typesafe-sdk
  # client, no network call and no TYPESAFE_API_KEY needed.
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 30 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"
      - run: python3 -m unittest scripts/test_scope_classify.py -v

  # Runs the classifier for visibility on this repo's own PRs. The generic
  # CI gate calls this reusable classifier from JacobPEvans/.github.
  scope:
    uses: ./.github/workflows/scope-classify.yml
    secrets:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
