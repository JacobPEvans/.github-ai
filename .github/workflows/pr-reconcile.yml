# PR Reconcile
#
# Reusable workflow that keeps open pull requests mergeable without a model.
# BEHIND: update-branch. DIRTY: merge-conflict label, needs-lead when workflow
# files are involved, and a repository_dispatch to resolver_repo when set.
# Every reconcile also sets the merge-hold commit status at the head.
#
# Modes (exactly one): pr_number (one PR), base_ref (every open PR on a base,
# for push-to-base), sweep_owner (every open PR of an owner, for the schedule).
#
# conflict_fix: true queues each eligible conflicted PR (one per head commit) in
# the conflict_prs output instead of dispatching; the caller runs cc-conflict-fix.yml
# as a matrix job over it. Example: examples/pr-reconcile-caller.yml.
#
# Token: when the caller grants id-token: write and passes OPENBAO_ADDR, outside
# sweep mode, a token for the calling repository is minted through the store's
# pr-reconcile OIDC role with the sweep's permission set. Otherwise an App token
# limited to contents, pull requests, issues and statuses, scoped to the calling
# repository except in sweep mode. Neither can write workflow files. runner_label
# picks the runner (GitHub-hosted by default). The scheduled sweep of this
# repository runs in pr-reconcile-sweep.yml instead.

name: PR Reconcile

on:
  workflow_call:
    inputs:
      pr_number:
        type: string
        default: ""
      base_ref:
        type: string
        default: ""
      sweep_owner:
        type: string
        default: ""
      resolver_repo:
        description: "owner/repo that receives the pr-conflict repository_dispatch (empty = label only); must have the same owner as the swept or calling repository"
        type: string
        default: ""
      conflict_fix:
        description: "Queue eligible conflicted pull requests in the conflict_prs output for a cc-conflict-fix.yml job in the caller"
        type: boolean
        default: false
      runner_label:
        description: "Runner label for the reconcile job; the OIDC path needs a runner that reaches the store"
        type: string
        default: ubuntu-24.04
    outputs:
      conflict_prs:
        description: JSON array of the pull request numbers queued for a conflict fix ('[]' when none)
        value: ${{ jobs.reconcile.outputs.conflict_prs }}
    secrets:
      GH_APP_CLAUDE_BOT_PRIVATE_KEY:
        required: false
      OPENBAO_ADDR:
        required: false
      PR_RECONCILE_EXCLUDE_REPOS:
        required: false

permissions:
  contents: read

concurrency:
  group: pr-reconcile-${{ github.repository }}-${{ inputs.pr_number || inputs.base_ref || inputs.sweep_owner }}
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 5
    outputs:
      conflict_prs: ${{ steps.reconcile.outputs.conflict_prs || '[]' }}
    steps:
      - name: Checkout reconcile script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: JacobPEvans/.github-ai
          ref: ${{ job.workflow_sha }}
          sparse-checkout: |
            .github/actions/pr-reconcile-run
            .github/scripts/pr-reconcile
          sparse-checkout-cone-mode: false
          path: .ai-workflows
          persist-credentials: false

      # Single-PR and base modes get a token for the calling repository (plus the resolver
      # repository when it has the same owner); a sweep covers the whole owner.
      - name: Token scope
        id: scope
        env:
          SWEEP_OWNER: ${{ inputs.sweep_owner }}
          RESOLVER_REPO: ${{ inputs.resolver_repo }}
        run: |
          repos=""
          if [ -z "$SWEEP_OWNER" ]; then
            repos="${GITHUB_REPOSITORY#*/}"
            if [ "${RESOLVER_REPO%%/*}" = "$GITHUB_REPOSITORY_OWNER" ] && [ "${RESOLVER_REPO#*/}" != "$repos" ]; then
              repos="$repos,${RESOLVER_REPO#*/}"
            fi
          fi
          echo "repositories=$repos" >> "$GITHUB_OUTPUT"

      # The OIDC path runs only when the caller grants id-token (the request URL is set) and passes the store address.
      - name: Find the OpenBao address
        id: bao
        env:
          ADDR: ${{ secrets.OPENBAO_ADDR }}
          SWEEP_OWNER: ${{ inputs.sweep_owner }}
        run: |
          if [ -n "$ADDR" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -z "$SWEEP_OWNER" ]; then
            echo "addr=$ADDR" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to OpenBao
        id: login
        if: steps.bao.outputs.addr != ''
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ steps.bao.outputs.addr }}
          method: jwt
          path: github-actions
          role: pr-reconcile
          jwtGithubAudience: openbao
          exportEnv: false
          exportToken: false
          outputToken: true

      - name: Mint repository token
        id: bao-token
        if: steps.bao.outputs.addr != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          BAO_ADDR: ${{ steps.bao.outputs.addr }}
          BAO_TOKEN: ${{ steps.login.outputs.vault_token }}
          REPOSITORIES: ${{ steps.scope.outputs.repositories }}
        with:
          script: |
            const permissions = { actions: 'write', checks: 'read', contents: 'write', pull_requests: 'write', statuses: 'write' };
            const repositories = process.env.REPOSITORIES.split(',');
            const res = await fetch(`${process.env.BAO_ADDR}/v1/github/token`, {
              method: 'POST',
              headers: { 'X-Vault-Token': process.env.BAO_TOKEN },
              body: JSON.stringify({ org_name: context.repo.owner, repositories, permissions }),
            });
            if (!res.ok) throw new Error(`Mint repository token: HTTP ${res.status}`);
            const token = (await res.json()).data?.token;
            if (!token) throw new Error('Mint repository token: no token in the response');
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Mint App token
        id: app-token
        if: steps.bao.outputs.addr == ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.GH_APP_CLAUDE_BOT_ID }}
          private-key: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}
          owner: ${{ inputs.sweep_owner || github.repository_owner }}
          repositories: ${{ steps.scope.outputs.repositories }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-statuses: write

      - name: Reconcile
        id: reconcile
        uses: ./.ai-workflows/.github/actions/pr-reconcile-run
        with:
          github-token: ${{ steps.bao-token.outputs.token || steps.app-token.outputs.token }}
          pr_number: ${{ inputs.pr_number }}
          base_ref: ${{ inputs.base_ref }}
          sweep_owner: ${{ inputs.sweep_owner }}
          resolver_repo: ${{ inputs.resolver_repo }}
          exclude_repos: ${{ secrets.PR_RECONCILE_EXCLUDE_REPOS }}
          conflict_output: ${{ inputs.conflict_fix }}
