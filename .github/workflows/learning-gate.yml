name: Nightly learning gate

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Evaluate only, or allow eligible proposals to auto-merge
        type: choice
        options: [canary, full]
        default: canary
        required: true
      evals_ref:
        description: Exact 40-character llm-prompt-evals commit (empty uses current develop)
        type: string
        default: ""
        required: false
      allowed_paths:
        description: Comma-separated path globs eligible for auto-merge
        type: string
        default: "prompts/**,skills/**"
        required: false
  workflow_call:
    inputs:
      mode:
        description: Evaluate only, or allow eligible proposals to auto-merge
        type: string
        default: canary
        required: false
      evals_ref:
        description: Exact 40-character llm-prompt-evals commit (empty uses current develop)
        type: string
        default: ""
        required: false
      allowed_paths:
        description: Comma-separated path globs eligible for auto-merge
        type: string
        default: "prompts/**,skills/**"
        required: false
    secrets:
      LANGFUSE_BASE_URL:
        required: false
      LANGFUSE_PUBLIC_KEY:
        required: false
      LANGFUSE_SECRET_KEY:
        required: false
      LLM_ROUTER_BASE_URL:
        description: >-
          The router's OpenAI-compatible base URL, ending in /v1. A secret
          rather than a variable: run logs print step environments verbatim.
        required: true
      LLM_ROUTER_API_KEY:
        description: >-
          Scoped router key for CI (never the router's master key).
        required: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: learning-gate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # Read-only token. Runs the held-out suite over PR-authored prompt text, so it
  # must never hold a write-capable token.
  evaluate:
    name: Evaluate held-out learning proposals
    runs-on: self-hosted
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 60 }}
    permissions:
      contents: read
      pull-requests: read
    env:
      MODE: ${{ inputs.mode || 'canary' }}
      EVALS_REF: ${{ inputs.evals_ref }}
      ALLOWED_PATHS: ${{ inputs.allowed_paths || 'prompts/**,skills/**' }}
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-workflows
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/scripts
          path: .ai-workflows
          persist-credentials: false

      - name: Resolve immutable evals ref
        id: evals
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          EVALS_REF: ${{ inputs.evals_ref }}
        with:
          script: |
            const gate = require('./.ai-workflows/.github/scripts/learning-gate/learning-gate.js');
            await gate.resolveEvalsRef({ core });

      - name: Checkout held-out eval suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/llm-prompt-evals
          ref: ${{ steps.evals.outputs.ref }}
          path: .llm-prompt-evals
          persist-credentials: false

      - name: Evaluate proposals and write decisions
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          EVALS_DIR: ${{ github.workspace }}/.llm-prompt-evals
          WORK_DIR: ${{ runner.temp }}/learning-gate
          PLAN_PATH: ${{ runner.temp }}/learning-gate/plan.json
          SCORES_PATH: ${{ runner.temp }}/learning-gate/scores.json
          DECISIONS_PATH: ${{ runner.temp }}/learning-gate/decisions.json
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LLM_ROUTER_BASE_URL: ${{ secrets.LLM_ROUTER_BASE_URL }}
          LLM_ROUTER_API_KEY: ${{ secrets.LLM_ROUTER_API_KEY }}
        with:
          script: |
            const gate = require('./.ai-workflows/.github/scripts/learning-gate/learning-gate.js');
            await gate.evaluate({ github, context, core });

      - name: Upload decisions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: learning-gate-decisions
          path: ${{ runner.temp }}/learning-gate/decisions.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish learning-gate decisions
    needs: evaluate
    if: ${{ inputs.mode == 'full' }}
    # Holds the write token and never reaches the router, so it stays off the
    # self-hosted pool that runs PR-authored prompt text.
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 10 }}
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      MODE: ${{ inputs.mode || 'canary' }}
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-workflows
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/scripts
          path: .ai-workflows
          persist-credentials: false

      - name: Download decisions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: learning-gate-decisions
          path: ${{ runner.temp }}/learning-gate

      - name: Publish labels, comments, and eligible auto-merges
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          WORK_DIR: ${{ runner.temp }}/learning-gate
          DECISIONS_PATH: ${{ runner.temp }}/learning-gate/decisions.json
        with:
          script: |
            const gate = require('./.ai-workflows/.github/scripts/learning-gate/learning-gate.js');
            await gate.publish({ github, context, core });
