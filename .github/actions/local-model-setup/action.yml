name: Local model setup
description: Validate local-only flow settings and obtain its scoped router key.
inputs:
  model:
    description: Existing local router role.
    required: true
  base_url:
    description: Router base URL.
    required: true
  openbao_addr:
    description: Credential service URL.
    required: true
  otel_endpoint:
    description: Trace exporter endpoint.
    required: true
  daily_run_limit:
    description: Positive daily run limit.
    required: true
  role:
    description: OIDC role for this workflow.
    required: true
  key_selector:
    description: Vault action selector for the scoped router key.
    required: true
outputs:
  LLM_ROUTER_API_KEY:
    description: Scoped router key.
    value: ${{ steps.key.outputs.LLM_ROUTER_API_KEY }}
runs:
  using: composite
  steps:
    - name: Validate local model flow configuration
      shell: bash
      env:
        LOCAL_MODEL: ${{ inputs.model }}
        LLM_ROUTER_BASE_URL: ${{ inputs.base_url }}
        OPENBAO_ADDR: ${{ inputs.openbao_addr }}
        OTEL_ENDPOINT: ${{ inputs.otel_endpoint }}
        DAILY_RUN_LIMIT: ${{ inputs.daily_run_limit }}
      run: |
        fail=0
        need() { test -n "$2" || { echo "$1 is required when local_only is true" >&2; fail=1; }; }
        need local_model "$LOCAL_MODEL"
        need LLM_ROUTER_BASE_URL "$LLM_ROUTER_BASE_URL"
        need OPENBAO_ADDR "$OPENBAO_ADDR"
        need AI_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT "$OTEL_ENDPOINT"
        limit="${DAILY_RUN_LIMIT#"${DAILY_RUN_LIMIT%%[!0]*}"}"
        bad=0
        case "$limit" in ''|*[!0-9]*|????????????????[0-9]*) bad=1 ;; esac
        if [ "${#limit}" -eq 16 ] && [ "$limit" \> 9007199254740991 ]; then bad=1; fi
        if [ "$bad" -ne 0 ]; then echo "daily_run_limit must be a positive integer no larger than 9007199254740991" >&2; fail=1; fi
        exit "$fail"
    - name: Read router key through OIDC
      id: key
      uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
      with:
        url: ${{ inputs.openbao_addr }}
        method: jwt
        path: github-actions
        role: ${{ inputs.role }}
        jwtGithubAudience: https://github.com/${{ github.repository_owner }}
        exportEnv: false
        exportToken: false
        secrets: |
          ${{ inputs.key_selector }} | LLM_ROUTER_API_KEY
