name: Run PR Reconcile
description: Run the PR Reconcile script with a caller-minted token. Exactly one of pr_number, base_ref or sweep_owner is set.
inputs:
  github-token:
    description: Token limited to actions, checks (read), contents, pull requests, issues and statuses.
    required: true
  pr_number:
    description: One pull request in the calling repository.
    required: false
    default: ""
  base_ref:
    description: Every open pull request on this base in the calling repository.
    required: false
    default: ""
  sweep_owner:
    description: Every open pull request of this owner.
    required: false
    default: ""
  resolver_repo:
    description: owner/repo that receives the pr-conflict repository_dispatch (empty = label only).
    required: false
    default: ""
  ci_fix_workflow:
    description: Workflow file name in the calling repository to dispatch for a failed check, e.g. openhands-ci-fix.yml (empty = off).
    required: false
    default: ""
  ci_fix_skip_checks:
    description: Case-insensitive regex of check-run names that never start a CI fix (empty = built-in default).
    required: false
    default: ""
  merge:
    description: "'true' merges a bot pull request that is green at its exact head with a successful AI Merge Gate (empty = off)."
    required: false
    default: ""
  exclude_repos:
    description: Comma-separated repositories the sweep skips.
    required: false
    default: ""
  conflict_output:
    description: "'true' queues eligible conflicted pull requests in the conflict_prs output instead of dispatching a fix (empty = off)."
    required: false
    default: ""
  fixer_version:
    description: Commit of the fixer workflows the callers run; attempt records carry it (empty = unversioned records).
    required: false
    default: ""
outputs:
  conflict_prs:
    description: JSON array of the pull request numbers queued for a conflict fix ('[]' when none).
    value: ${{ steps.reconcile.outputs.conflict_prs }}
runs:
  using: composite
  steps:
    - name: Reconcile
      id: reconcile
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      env:
        ACTION_PATH: ${{ github.action_path }}
        PR_NUMBER: ${{ inputs.pr_number }}
        BASE_REF: ${{ inputs.base_ref }}
        SWEEP_OWNER: ${{ inputs.sweep_owner }}
        RESOLVER_REPO: ${{ inputs.resolver_repo }}
        CI_FIX_WORKFLOW: ${{ inputs.ci_fix_workflow }}
        CI_FIX_SKIP_CHECKS: ${{ inputs.ci_fix_skip_checks }}
        MERGE_ENABLED: ${{ inputs.merge }}
        PR_RECONCILE_EXCLUDE_REPOS: ${{ inputs.exclude_repos }}
        CONFLICT_OUTPUT: ${{ inputs.conflict_output }}
        FIXER_VERSION: ${{ inputs.fixer_version }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const path = require('path');
          const run = require(path.join(process.env.ACTION_PATH, '../../scripts/pr-reconcile/reconcile.js'));
          await run({ github, context, core });
